<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Lawrence E. Corbridge</td>
            <td><a href="https://speeches.byu.edu/talks/lawrence-e-corbridge/stand-for-ever/" target="_blank">Stand Forever</a></td>
            <td>BYU</td>
            <td>2019</td>
          </tr>
          <tr>
            <td>Sheri Dew</td>
            <td><a href="https://www.byui.edu/speeches/sheri-dew/will-you-engage-in-the-wrestle" target="_blank">Will You Engage in the Wrestle?</a></td>
            <td>BYU-Idaho</td>
            <td>2016</td>
          </tr>
          <tr>
            <td>Paul Alan Cox</td>
            <td><a href="https://speeches.byu.edu/talks/paul-alan-cox/seeing-new-eyes/" target="_blank">Seeing with New Eyes</a></td>
            <td>BYU</td>
            <td>1995</td>
          </tr>
        </table>
        <h2>Add your own!</h2>
        <form>
          <div class="input-grid">
            <label for="speaker">Speaker:</label>
            <input type="text" name="speaker">
            <label for="title">Title:</label>
            <input type="text" name="title">
            <label for="location">Location:</label>
            <input type="text" name="location">
            <label for="year">Year:</label>
            <input type="text" name="year">
          </div>
          <input type="submit" value="Submit">
        </form>

      </div>
    </main>
  </div>
</body>
</html>
