<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        #wrapper {
            border: 5px solid #000000;
            border-radius: 50px;
            margin: 15px auto;
            width: 450px;
            background: url("images/christus.webp");
            background-size: cover;
            background-position-x: -250px ;
            padding: 5px 125px;
            text-align: center;
            color: #ffffff;
        }   

        #fp-row {
            display: flex;
            justify-content:space-between;
        }
        
        #q12-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        #q12-grid img {
            width: 80px;
            height: 80px;
            border: 6px solid #ffffff;
            border-radius: 100%;
            object-fit: cover;
            margin: 7.5px 0px;
        }  

        .first-p {
            width: 100px;
            height: 100px;
            border: 6px solid #ffffff;
            border-radius: 100%;
            object-fit: cover;
            margin: 10px 0px 0px 0px;   
        }

        .pres {
            width: 110px;
            height: 110px;
            border: 6px solid #ffffff;
            border-radius: 100%;
            object-fit: cover;
        }

    </style>
</head>
<body style="background-color: #E8ECED;">
    <!-- Insert HTML elements here -->

    <div id="wrapper">
        <h1>First Presidency</h1>
        <div id="fp-row">
            <!-- FP Pics-->
             <img src="images/eyring.webp" alt="President Henry B. Eyring" class="first-p">
             <img src="images/oaks.webp" alt="President Dallin H. Oaks" class="pres">
             <img src="images/christofferson.webp" alt="President D. Todd Christofferson" class="first-p">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div id="q12-grid">
             <img src="images/uchtdorf.webp" alt="President Dieter F. Uchtdorf">
             <img src="images/bednar.webp" alt="Elder David A. Bednar">
             <img src="images/cook.webp" alt="Elder Quentin L. Cook">
             <img src="images/anderson.webp" alt="Elder Neil L. Anderson">
             <img src="images/rasband.webp" alt="Elder Ronald A. Rasband">
             <img src="images/stevenson.webp" alt="Elder Gary E. Stevenson">
             <img src="images/renlund.webp" alt="Elder Dale G. Renlund">
             <img src="images/gong.webp" alt="Elder Gerrit W. Gong">
             <img src="images/soares.webp" alt="Elder Ulisses S. Soares">
             <img src="images/kearon.webp" alt="Elder Patrick W. Kearon">
             <img src="images/causse.webp" alt="Gerald Causse">
             <img src="images/gilbert.webp" alt="Elder Clark G. Gilbert">

        </div>
    </div>
</body>
</html>
